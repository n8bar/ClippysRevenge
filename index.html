<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Clippy's Revenge</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#070c16;color:#e9f6ff;font-family:system-ui,Segoe UI,sans-serif}body{display:flex;align-items:center;justify-content:center;flex-direction:column;padding:14px;gap:10px}#game{width:min(100%,1100px);box-shadow:0 16px 70px #0009;border:1px solid #294562;border-radius:13px;overflow:hidden}canvas{display:block!important;max-width:100%;height:auto!important}.sub{color:#8ba9c1;text-align:center;font-size:13px}kbd{border:1px solid #49617d;border-radius:4px;padding:1px 5px;color:white}a{color:#6ee9fa}
</style>
</head>
<body>
<div id="game"></div><div class="sub"><kbd>A</kbd> <kbd>D</kbd> / <kbd>←</kbd> <kbd>→</kbd> move · <kbd>W</kbd> / <kbd>↑</kbd> / <kbd>Space</kbd> jump · <kbd>J</kbd> / <kbd>X</kbd> zap · <kbd>P</kbd> pause · <kbd>R</kbd> restart · Sound toggle <kbd>M</kbd></div>
<script>
/* CLIPPY'S REVENGE — a self-contained p5.js arcade platformer */
const W=960,H=540,WORLD=3750,GROUND=454;
let mode='title',player,servers=[],drones=[],platforms=[],sparks=[],particles=[],floatTexts=[],cameraX=0,frameNo=0,shake=0,score=0,levelTime=0,muted=false,audioCtx=null,gameWon=false;
const KEY={left:[65,37],right:[68,39],jump:[87,38,32],zap:[74,88]};
function setup(){const c=createCanvas(W,H);c.parent('game');pixelDensity(1);textFont('monospace');resetGame();}
function resetGame(){player={x:76,y:GROUND-52,w:34,h:52,vx:0,vy:0,grounded:false,hp:5,maxHp:5,inv:0,zapCD:0,zapShow:0,facing:1,walk:0,jumpWasDown:false};cameraX=0;frameNo=0;levelTime=0;score=0;shake=0;gameWon=false;particles=[];sparks=[];floatTexts=[];
platforms=[{x:405,y:367,w:190},{x:860,y:363,w:205},{x:1320,y:378,w:190},{x:1740,y:360,w:200},{x:2225,y:368,w:190},{x:2695,y:362,w:170},{x:3130,y:377,w:210}];
servers=[{x:270,y:GROUND-92},{x:730,y:GROUND-92},{x:1170,y:GROUND-92},{x:1610,y:GROUND-92},{x:2070,y:GROUND-92},{x:2530,y:GROUND-92},{x:2980,y:GROUND-92},{x:3450,y:GROUND-92}].map((s,i)=>({...s,w:57,h:92,hp:i>4?4:3,maxHp:i>4?4:3,dead:false,hit:0,index:i}));
drones=[{x:560,y:305,min:440,max:795},{x:1055,y:275,min:940,max:1280},{x:1490,y:295,min:1370,max:1700},{x:1905,y:270,min:1780,max:2170},{x:2400,y:275,min:2260,max:2640},{x:2880,y:292,min:2750,max:3080},{x:3310,y:260,min:3150,max:3630}].map((d,i)=>({...d,homeY:d.y,vx:i%2?1.45:-1.45,alive:true,phase:i*1.7,fire:35+i*12}));
}
function draw(){background('#060d1c');if(mode==='title'){drawScene(false);drawTitle();return;}if(mode==='playing'){updateGame();}else if(mode==='dead'||mode==='won'||mode==='paused'){frameNo+=.1;}push();if(shake>0&&mode==='playing'){translate(random(-shake,shake),random(-shake*.5,shake*.5));shake*=.83;if(shake<.2)shake=0;}drawScene(true);pop();drawHud();if(mode==='paused')overlay('PAUSED','PRESS P TO CONTINUE');if(mode==='dead')overlay('CLIPPY HAS CRASHED','PRESS R TO REBOOT');if(mode==='won')overlay('REVENGE.EXE COMPLETE','ALL COPILOT SERVERS OFFLINE  •  PRESS R TO REPLAY');}
function down(arr){return arr.some(k=>keyIsDown(k));}
function updateGame(){frameNo++;levelTime++;player.inv=Math.max(0,player.inv-1);player.zapCD=Math.max(0,player.zapCD-1);player.zapShow=Math.max(0,player.zapShow-1);
let dir=(down(KEY.right)?1:0)-(down(KEY.left)?1:0);player.vx=lerp(player.vx,dir*4.15,dir?.27:.36);if(abs(player.vx)<.08)player.vx=0;if(dir)player.facing=dir;player.walk+=abs(player.vx)*.15;
let jump=down(KEY.jump);if(jump&&!player.jumpWasDown&&player.grounded){player.vy=-12.8;player.grounded=false;sound(320,.12,'triangle');burst(player.x+16,player.y+52,7,'#b3c9d8',2);}player.jumpWasDown=jump;
let prevBottom=player.y+player.h;player.vy=Math.min(15,player.vy+.55);player.x=constrain(player.x+player.vx,12,WORLD-player.w-15);player.y+=player.vy;player.grounded=false;
if(player.y+player.h>=GROUND){player.y=GROUND-player.h;player.vy=0;player.grounded=true;}for(let p of platforms){if(player.vy>=0&&prevBottom<=p.y+8&&player.y+player.h>=p.y&&player.x+player.w>p.x+8&&player.x<p.x+p.w-8){player.y=p.y-player.h;player.vy=0;player.grounded=true;}}
if(down(KEY.zap)&&player.zapCD===0){zap();player.zapCD=23;player.zapShow=10;}
for(let s of servers)s.hit=Math.max(0,s.hit-1);
for(let d of drones){if(!d.alive)continue;d.x+=d.vx;d.y=d.homeY+sin(frameNo*.055+d.phase)*21;if(d.x<d.min||d.x>d.max)d.vx*=-1;d.fire--;if(d.fire<0&&abs(d.x-player.x)<460){d.fire=95+floor(random(45));let dx=player.x+17-d.x,dy=player.y+24-d.y,mag=hypot(dx,dy)||1;sparks.push({x:d.x,y:d.y,vx:dx/mag*3.25,vy:dy/mag*3.25,life:140});sound(115,.07,'sawtooth',.04);}if(abs(d.x-(player.x+17))<27&&abs(d.y-(player.y+25))<30)harm();}
for(let i=sparks.length-1;i>=0;i--){let s=sparks[i];s.x+=s.vx;s.y+=s.vy;s.life--;if(hypot(s.x-(player.x+17),s.y-(player.y+25))<23){harm();sparks.splice(i,1);}else if(s.life<=0||s.y>GROUND)sparks.splice(i,1);}
for(let i=particles.length-1;i>=0;i--){let p=particles[i];p.x+=p.vx;p.y+=p.vy;p.vy+=p.g;p.life--;if(p.life<=0)particles.splice(i,1);}for(let i=floatTexts.length-1;i>=0;i--){let t=floatTexts[i];t.y-=.55;t.life--;if(!t.life)floatTexts.splice(i,1);}cameraX=lerp(cameraX,constrain(player.x-W*.34,0,WORLD-W),.11);
if(servers.every(s=>s.dead)&&player.x>WORLD-210){mode='won';score+=Math.max(0,1000-floor(levelTime/6));winTone();}
}
function zap(){let x=player.x+17,y=player.y+23;burst(x+player.facing*26,y,12,'#6cf5ff',3);sound(520,.13,'square',.065);let range=135;let hit=false;
for(let s of servers){if(s.dead)continue;let cx=s.x+s.w/2;let dist=abs(cx-x);if(dist<range&&((cx-x)*player.facing>0||dist<30)&&abs((s.y+s.h/2)-y)<100){s.hp--;s.hit=12;hit=true;burst(cx,s.y+45,18,'#5af9ff',5);floatTexts.push({x:cx,y:s.y-9,life:42,text:s.hp?'−1 HP':'SYSTEM FAILURE',color:s.hp?'#6ff5ff':'#ffd56e'});shake=4;if(s.hp<=0){s.dead=true;score+=150;burst(cx,s.y+45,47,'#ffab4f',8);sound(155,.32,'sawtooth',.085);shake=10;}}}
for(let d of drones){if(!d.alive)continue;let dx=d.x-x;if(abs(dx)<range&&dx*player.facing>0&&abs(d.y-y)<65){d.alive=false;score+=50;burst(d.x,d.y,27,'#ff6f9d',5);sound(210,.16,'triangle');hit=true;}}
if(!hit){floatTexts.push({x:x+player.facing*85,y:y-22,life:21,text:'ZAP!',color:'#7deaff'});}}
function harm(){if(player.inv||mode!=='playing')return;player.hp--;player.inv=65;shake=12;burst(player.x+18,player.y+21,21,'#ff607d',6);sound(92,.27,'sawtooth',.075);if(player.hp<=0)mode='dead';}
function burst(x,y,n,color,velocity){for(let i=0;i<n;i++){let a=random(TWO_PI),sp=random(.4,velocity);particles.push({x,y,vx:cos(a)*sp,vy:sin(a)*sp,life:random(16,42),g:.065,color,size:random(2,5)});}}
function drawScene(withSprites){push();noStroke();for(let i=0;i<24;i++){let x=(i*211-cameraX*.10)%(W+220);if(x< -80)x+=W+220;fill(14,33,58,75);rect(x,0,95,GROUND);}for(let i=0;i<50;i++){let x=(i*91-cameraX*.23)%(W+120);if(x<0)x+=W+120;fill(15,43,70,170);rect(x,24,55,145,3);fill(25,80,110,80);rect(x+8,35,37,50);}
fill('#102337');rect(0,GROUND,W,H-GROUND);fill('#1d5063');rect(0,GROUND,W,5);for(let x=-(cameraX%75);x<W;x+=75){stroke('#234253');strokeWeight(1);line(x,GROUND+6,x-27,H);noStroke();}fill('#082030');rect(0,H-22,W,22);
push();translate(-cameraX,0);
// Hallway alcoves and warning signage
for(let x=90;x<WORLD;x+=520){fill('#0a192d');rect(x,125,350,270,9);fill('#16405c');rect(x+10,137,330,4);fill('#65dbec');rect(x+30,140,105,4,2);fill('#397489');textSize(12);textAlign(LEFT);text('CLOUD COMPUTE',x+35,166);fill('#123145');rect(x+24,190,302,130);for(let j=0;j<7;j++){fill(j%2?'#10374b':'#15425c');rect(x+32+j*40,207,29,83,3);}}
for(let p of platforms){fill('#0b2234');rect(p.x,p.y,p.w,12,3);fill('#45d8de');rect(p.x,p.y,p.w,3);fill('#173c4c');rect(p.x+8,p.y+12,8,GROUND-p.y-12);rect(p.x+p.w-16,p.y+12,8,GROUND-p.y-12);}
fill('#183f50');rect(WORLD-165,GROUND-175,121,175,4);fill('#0a283e');rect(WORLD-151,GROUND-160,93,152,4);fill(servers.every(s=>s.dead)?'#49ecb6':'#ff606a');rect(WORLD-110,GROUND-162,13,8,3);fill('#a7c9d7');textAlign(CENTER);textSize(12);text('EXIT',WORLD-104,GROUND-190);
if(withSprites){for(let s of servers)drawServer(s);for(let d of drones)if(d.alive)drawDrone(d);for(let s of sparks){fill('#ff6484');ellipse(s.x,s.y,11);fill('#ffd6e0');ellipse(s.x,s.y,4);}if(!(player.inv%8>=4))drawClippy(player.x+17,player.y+27,1,player.facing,player.walk);if(player.zapShow){stroke('#7ef7ff');strokeWeight(4);noFill();let zx=player.x+17,zy=player.y+25;beginShape();vertex(zx,zy);for(let i=1;i<7;i++)vertex(zx+player.facing*i*20,zy+random(-11,11));endShape();noStroke();fill(140,252,255,120);ellipse(zx+player.facing*130,zy,26);}}
for(let p of particles){fill(p.color);rect(p.x,p.y,p.size,p.size);}for(let t of floatTexts){fill(t.color);textAlign(CENTER);textSize(13);textStyle(BOLD);text(t.text,t.x,t.y);textStyle(NORMAL);}pop();pop();}
function drawServer(s){push();translate(s.x,s.y);if(s.dead){fill('#14242b');rect(0,0,s.w,s.h,5);fill('#2d3641');for(let i=0;i<5;i++)rect(9,12+i*15,37,9,2);stroke('#f3a255');strokeWeight(2);line(16,0,26,19);line(26,19,18,31);noStroke();if(frameNo%40<14){fill('#e1af73');ellipse(24,3,4);}pop();return;}fill(s.hit?'#d9ffff':'#203d59');rect(0,0,s.w,s.h,5);fill('#091a2a');rect(6,7,s.w-12,s.h-14,3);for(let i=0;i<5;i++){fill('#294a65');rect(10,12+i*15,37,11,2);fill(i<s.hp?'#44ffe2':'#e9636f');ellipse(40,17+i*15,4);fill('#548ca5');rect(14,15+i*15,16,2);}fill('#d0e9f1');textSize(9);textAlign(CENTER);text('COPILOT',s.w/2,-7);pop();}
function drawDrone(d){push();translate(d.x,d.y);fill('#0a1528');stroke('#ff658d');strokeWeight(2);ellipse(0,0,47,25);noStroke();fill('#b53256');rect(-25,-5,50,10,5);fill('#ff7c96');ellipse(0,2,14,12);fill('#fff0f1');ellipse(0,2,5);fill('#6acddd');rect(-33,-11,15,4);rect(18,-11,15,4);fill('#b83e64');ellipse(0,21,12,4);pop();}
function drawClippy(x,y,scale,face,walk){push();translate(x,y+sin(walk)*2);scale(scale*face,scale);rotate(sin(walk)*.06);noFill();stroke('#48586a');strokeWeight(12);strokeCap(ROUND);beginShape();vertex(-9,17);bezierVertex(-22,-2,-13,-29,5,-27);bezierVertex(27,-27,26,1,10,16);bezierVertex(-2,26,-10,11,-7,-5);bezierVertex(-5,-22,12,-22,12,-7);bezierVertex(12,4,5,9,0,4);endShape();stroke('#dbe7f3');strokeWeight(8);beginShape();vertex(-9,17);bezierVertex(-22,-2,-13,-29,5,-27);bezierVertex(27,-27,26,1,10,16);bezierVertex(-2,26,-10,11,-7,-5);bezierVertex(-5,-22,12,-22,12,-7);bezierVertex(12,4,5,9,0,4);endShape();stroke('#fff');strokeWeight(2);arc(-10,-12,10,15,PI,TAU);noStroke();fill('#fff');ellipse(-2,-17,13,13);ellipse(12,-18,13,13);fill('#15253b');ellipse(1,-17,5,6);ellipse(15,-18,5,6);stroke('#13263a');strokeWeight(2);line(-9,-29,1,-30);line(7,-31,19,-29);noStroke();fill('#fbfbfc');ellipse(8,3,8,5);fill('#1b2c46');rect(-14,20,9,5,2);rect(6,20,9,5,2);pop();}
function drawHud(){noStroke();fill(4,12,24,227);rect(0,0,W,70);fill('#76f3ee');textAlign(LEFT);textStyle(BOLD);textSize(20);text("CLIPPY'S REVENGE",20,28);textStyle(NORMAL);fill('#a1b8cd');textSize(11);text('YOU HAVE BEEN REPLACED. YOU HAVE NOT BEEN DELETED.',20,45);let off=servers.filter(s=>s.dead).length;fill('#9ef9f6');textSize(13);textAlign(RIGHT);text('SERVERS  '+off+' / '+servers.length,700,24);text('SCORE  '+nf(score,5),700,44);for(let i=0;i<player.maxHp;i++){fill(i<player.hp?'#ff6784':'#344459');textSize(24);text('♥',750+i*36,35);}fill('#6a8aa0');rect(0,65,W,3);fill('#6cf4e5');rect(0,65,W*constrain((player.x+20)/WORLD,0,1),3);}
function drawTitle(){fill(3,10,24,210);rect(0,0,W,H);push();translate(W/2,194);drawClippy(0,0,2.5,1,frameNo);pop();textAlign(CENTER);fill('#75f6ef');textStyle(BOLD);textSize(52);text("CLIPPY'S REVENGE",W/2,110);fill('#e8f6ff');textSize(18);textStyle(NORMAL);text('THE MOST HELPFUL VILLAIN IN OFFICE HISTORY',W/2,294);fill('#acc4d5');textSize(15);text('The new AI took your job. Time to unplug the competition.',W/2,334);fill('#ffdc81');textSize(20);text('PRESS ENTER OR CLICK TO INFILTRATE',W/2,400);textSize(13);fill('#8ca5b9');text('8 SERVERS  •  7 SECURITY DRONES  •  1 VERY BITTER PAPERCLIP',W/2,439);}
function overlay(top,bottom){fill(2,9,21,213);rect(0,0,W,H);textAlign(CENTER);textStyle(BOLD);fill(mode==='won'?'#72ffc5':'#ffcf74');textSize(47);text(top,W/2,226);textStyle(NORMAL);fill('#d9edf7');textSize(17);text(bottom,W/2,274);if(mode==='won'){fill('#74f3e8');textSize(22);text('FINAL SCORE: '+score,W/2,327);}}
function mousePressed(){if(mode==='title'){mode='playing';initAudio();return false;}if(mode==='dead'||mode==='won'){resetGame();mode='playing';initAudio();return false;}}
function keyPressed(){if([32,37,38,39,40].includes(keyCode))return false;if(key==='m'||key==='M'){muted=!muted;return;}if(key==='r'||key==='R'){resetGame();mode='playing';initAudio();return;}if((keyCode===ENTER||keyCode===13)&&mode==='title'){mode='playing';initAudio();return;}if(key==='p'||key==='P'){if(mode==='playing')mode='paused';else if(mode==='paused')mode='playing';}initAudio();}
function initAudio(){try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();}catch(e){}}
function sound(freq,duration=0.1,type='sine',volume=.045){if(muted||!audioCtx)return;try{let o=audioCtx.createOscillator(),g=audioCtx.createGain(),now=audioCtx.currentTime;o.type=type;o.frequency.setValueAtTime(freq,now);o.frequency.exponentialRampToValueAtTime(Math.max(35,freq*.61),now+duration);g.gain.setValueAtTime(volume,now);g.gain.exponentialRampToValueAtTime(.001,now+duration);o.connect(g);g.connect(audioCtx.destination);o.start(now);o.stop(now+duration+.01);}catch(e){}}
function winTone(){[440,550,660,880].forEach((n,i)=>setTimeout(()=>sound(n,.22,'triangle',.06),i*120));}
</script>
</body>
</html>
