<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#081327">
  <meta name="description" content="Clippy's Revenge: an arcade platformer where one jealous paperclip takes on a headquarters full of Copilot servers.">
  <title>Clippy's Revenge — A Phaser 4 Game</title>
  <style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 20%,#162d4c,#050915 75%);color:#e6f9ff;display:grid;place-items:center}main{width:min(100%,1056px);padding:12px}header{display:flex;align-items:center;gap:10px;margin:0 0 12px;font-size:clamp(19px,3vw,28px);font-weight:900;letter-spacing:2px}header b{color:#4de2ee}.logo{font-size:32px}.edition{font-size:11px;color:#91abc3;margin-left:auto;letter-spacing:2px}#game{width:100%;aspect-ratio:16 / 9;display:grid;place-items:center;border:2px solid #26738b;border-radius:9px;overflow:hidden;background:linear-gradient(#07172c,#10192d);box-shadow:0 14px 54px #0008}#game canvas{display:block;max-width:100%}.controls{display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;margin:14px 2px 0;color:#9bb8d2;font-size:12px}.controls b{color:#f0fcff}#error{color:#ff9fa8;text-align:center}

</style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/4.2.1/phaser.min.js"></script>
</head>
<body>
  <main>
    <header><span class="logo">📎</span> <span>CLIPPY'S <b>REVENGE</b></span><span class="edition">PHASER EDITION</span></header>
    <div id="game" role="application" aria-label="Clippy's Revenge browser platformer"></div>
    <div class="controls"><span><b>A / D</b> or <b>← / →</b> Move</span><span><b>W / ↑ / Space</b> Jump</span><span><b>J / X</b> Zap</span><span><b>P</b> Pause</span><span><b>R</b> Restart</span><span><b>M</b> Sound</span></div>
    <p id="error" role="alert" hidden>Game failed to load. Check your internet connection and refresh the page.</p>
  </main>
  <script>
/* Clippy's Revenge | Phaser 4.2.1 | No external art assets */
(() => {
  'use strict';
  if (!window.Phaser) {
    document.getElementById('error').hidden = false;
    return;
  }

  const VW = 960, VH = 540, WORLD = 3200, FLOOR_Y = 476;
  const RACK_X = [340, 680, 1020, 1360, 1700, 2040, 2380, 2720];
  const DRONE_X = [540, 1180, 1830, 2500];
  const TOTAL = RACK_X.length;

  function paintTexture(scene, key, w, h, draw) {
    const tex = scene.textures.createCanvas(key, w, h);
    const ctx = tex.getContext();
    draw(ctx, w, h);
    tex.refresh();
  }

  function roundRect(ctx, x, y, w, h, r, fill, stroke, line = 1) {
    ctx.beginPath(); ctx.roundRect(x, y, w, h, r);
    if (fill) { ctx.fillStyle = fill; ctx.fill(); }
    if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = line; ctx.stroke(); }
  }

  function makeArt(scene) {
    paintTexture(scene, 'wall', 400, VH, (c) => {
      const g = c.createLinearGradient(0, 0, 0, VH);
      g.addColorStop(0, '#142c48'); g.addColorStop(0.58, '#102238'); g.addColorStop(1, '#0a1528');
      c.fillStyle = g; c.fillRect(0, 0, 400, VH);
      c.fillStyle = '#132a45'; c.fillRect(18, 82, 364, 320);
      c.strokeStyle = '#294962'; c.lineWidth = 4; c.strokeRect(18, 82, 364, 320);
      c.fillStyle = '#0b1a2c'; c.fillRect(42, 111, 134, 180); c.fillRect(223, 111, 130, 180);
      c.strokeStyle = '#33536a'; c.lineWidth = 3; c.strokeRect(42, 111, 134, 180); c.strokeRect(223, 111, 130, 180);
      c.fillStyle = '#133955'; c.fillRect(69, 123, 18, 153); c.fillRect(247, 123, 18, 153);
      c.fillStyle = '#59d3e3'; c.globalAlpha = 0.18; c.fillRect(46, 118, 126, 22); c.fillRect(227, 118, 122, 22); c.globalAlpha = 1;
      c.fillStyle = '#1b4054'; c.fillRect(0, 40, 400, 18); c.fillRect(0, 416, 400, 12);
      c.fillStyle = '#7de0eb'; c.globalAlpha = .4; c.fillRect(42, 42, 104, 5); c.globalAlpha = 1;
      for (let i = 0; i < 11; i++) { c.fillStyle = i % 2 ? '#23415b' : '#193852'; c.fillRect(20 + i * 35, 435, 26, 30); }
    });
    paintTexture(scene, 'floor', 100, 64, (c) => {
      c.fillStyle = '#23394d'; c.fillRect(0, 0, 100, 64);
      c.fillStyle = '#4b6e81'; c.fillRect(0, 0, 100, 5);
      c.fillStyle = '#122439'; c.fillRect(0, 7, 100, 4);
      c.strokeStyle = '#456178'; c.lineWidth = 2; c.strokeRect(2, 14, 96, 47);
      c.fillStyle = '#101d2c'; c.fillRect(43, 17, 15, 42);
      c.fillStyle = '#87c2cb'; c.fillRect(5, 15, 8, 3); c.fillRect(88, 15, 8, 3);
    });
    paintTexture(scene, 'pixel', 2, 2, c => { c.fillStyle = '#fff'; c.fillRect(0, 0, 2, 2); });
    paintTexture(scene, 'clippy', 76, 94, c => {
      c.lineCap = 'round'; c.lineJoin = 'round';
      // Dark outline beneath the metallic loops makes the clip unmistakable.
      const path = () => {
        c.beginPath(); c.moveTo(43, 13); c.bezierCurveTo(43, 3, 21, 3, 21, 20);
        c.lineTo(21, 65); c.bezierCurveTo(21, 88, 56, 88, 56, 64);
        c.lineTo(56, 23); c.bezierCurveTo(56, 5, 29, 6, 29, 24);
        c.lineTo(29, 61); c.bezierCurveTo(29, 72, 45, 72, 45, 60); c.lineTo(45, 26);
      };
      path(); c.strokeStyle = '#061521'; c.lineWidth = 14; c.stroke();
      path(); c.strokeStyle = '#95aab9'; c.lineWidth = 10; c.stroke();
      path(); c.strokeStyle = '#ecfaff'; c.lineWidth = 4; c.stroke();
      // Face and expressive eyebrows.
      c.fillStyle = '#fff'; c.beginPath(); c.ellipse(30, 29, 11, 12, 0, 0, Math.PI * 2); c.ellipse(50, 29, 11, 12, 0, 0, Math.PI * 2); c.fill();
      c.fillStyle = '#06263b'; c.beginPath(); c.arc(33, 30, 4.7, 0, Math.PI * 2); c.arc(48, 30, 4.7, 0, Math.PI * 2); c.fill();
      c.strokeStyle = '#082335'; c.lineWidth = 3; c.beginPath(); c.moveTo(20, 15); c.lineTo(34, 18); c.moveTo(46, 18); c.lineTo(60, 14); c.stroke();
      c.beginPath(); c.arc(40, 45, 9, 0.22, Math.PI - .22, false); c.stroke();
    });
    for (const off of [false, true]) {
      paintTexture(scene, off ? 'rack-off' : 'rack', 86, 108, c => {
        roundRect(c, 5, 4, 76, 99, 8, off ? '#303d48' : '#1b364d', '#6f91a9', 4);
        roundRect(c, 10, 10, 66, 21, 3, off ? '#1c2b36' : '#145978', '#497b93', 2);
        c.fillStyle = off ? '#83949c' : '#b8f7ff'; c.font = 'bold 11px monospace'; c.textAlign = 'center'; c.fillText(off ? 'OFFLINE' : 'COPILOT', 43, 24);
        for (let i = 0; i < 5; i++) {
          const y = 38 + i * 12;
          roundRect(c, 13, y, 60, 10, 2, off ? '#18232a' : '#0b1c30', '#41576b', 1);
          c.fillStyle = off ? '#ea745e' : '#47f6c6'; c.beginPath(); c.arc(20, y + 5, 2.7, 0, Math.PI * 2); c.fill();
          c.fillStyle = off ? '#37424a' : '#358ca8'; c.fillRect(28, y + 4, 35, 2);
        }
        if (off) { c.strokeStyle = '#ef7462'; c.lineWidth = 4; c.beginPath(); c.moveTo(18, 45); c.lineTo(67, 85); c.moveTo(67, 45); c.lineTo(18, 85); c.stroke(); }
        c.fillStyle = '#8cabbc'; c.fillRect(14, 102, 12, 5); c.fillRect(60, 102, 12, 5);
      });
    }
    paintTexture(scene, 'drone', 78, 54, c => {
      c.fillStyle = '#43576c'; c.fillRect(2, 18, 22, 7); c.fillRect(54, 18, 22, 7);
      roundRect(c, 14, 14, 50, 31, 13, '#586d83', '#b9d7e8', 3);
      c.fillStyle = '#102738'; c.beginPath(); c.ellipse(39, 29, 13, 12, 0, 0, Math.PI * 2); c.fill();
      c.fillStyle = '#fc6879'; c.beginPath(); c.arc(39, 28, 7, 0, Math.PI * 2); c.fill();
      c.fillStyle = '#fff'; c.beginPath(); c.arc(37, 26, 2.3, 0, Math.PI * 2); c.fill();
      c.strokeStyle = '#a0cedd'; c.lineWidth = 2; c.beginPath(); c.moveTo(39, 15); c.lineTo(39, 6); c.stroke();
      c.fillStyle = '#ff6072'; c.beginPath(); c.arc(39, 6, 3, 0, Math.PI * 2); c.fill();
    });
    paintTexture(scene, 'bolt', 30, 20, c => {
      c.shadowColor = '#77faff'; c.shadowBlur = 12;
      c.fillStyle = '#69f6ff'; c.beginPath(); c.moveTo(17, 1); c.lineTo(5, 11); c.lineTo(14, 11); c.lineTo(11, 19); c.lineTo(28, 7); c.lineTo(18, 7); c.closePath(); c.fill();
      c.shadowBlur = 0;
    });
    for (const open of [false, true]) {
      paintTexture(scene, open ? 'exit-open' : 'exit', 100, 134, c => {
        roundRect(c, 7, 6, 86, 126, 8, open ? '#164d4d' : '#27304b', open ? '#55f5bc' : '#f08b93', 5);
        roundRect(c, 19, 22, 62, 97, 5, open ? '#174d4d' : '#101b30', open ? '#3ecda0' : '#475a75', 3);
        c.fillStyle = open ? '#87ffe3' : '#ffb3b8'; c.textAlign = 'center'; c.font = 'bold 15px monospace'; c.fillText(open ? 'EXIT' : 'LOCKED', 50, 17);
        c.fillStyle = open ? '#55f5bc' : '#fa6673'; c.fillRect(66, 67, 8, 8);
        if (open) { c.fillStyle = '#65bbac'; c.globalAlpha = .22; c.fillRect(23, 27, 54, 87); c.globalAlpha = 1; }
      });
    }
  }

  class GameScene extends Phaser.Scene {
    constructor() { super('Game'); }

    create() {
      makeArt(this);
      this.phase = 'intro'; this.destroyed = 0; this.hearts = 5; this.score = 0;
      this.facing = 1; this.lastShot = -1000; this.lastHurt = -2000;
      this.muted = false; this.lastMessage = 0;
      this.physics.world.setBounds(0, 0, WORLD, VH);
      this.cameras.main.setBounds(0, 0, WORLD, VH);
      this.add.tileSprite(WORLD / 2, VH / 2, WORLD, VH, 'wall').setDepth(-50);
      this.add.tileSprite(WORLD / 2, FLOOR_Y + 32, WORLD, 64, 'floor').setDepth(2);
      // Non-destructive set dressing: signs and warning stripes.
      for (let x = 210; x < WORLD; x += 400) {
        this.add.rectangle(x, 67, 190, 15, 0x214761).setDepth(-10);
        this.add.text(x - 78, 58, 'C O R P O R A T E  H Q', { fontFamily: 'monospace', fontSize: '10px', color: '#86c3d7' }).setDepth(-8);
      }
      for (let x = 0; x < WORLD; x += 120) {
        this.add.rectangle(x + 60, FLOOR_Y + 3, 52, 5, 0xe6b753, .64).setDepth(5);
      }
      this.floorBody = this.physics.add.staticImage(WORLD / 2, FLOOR_Y + 32, 'pixel');
      this.floorBody.setDisplaySize(WORLD, 64).refreshBody().setVisible(false);

      this.racks = this.physics.add.staticGroup();
      for (let i = 0; i < RACK_X.length; i++) {
        const x = RACK_X[i];
        const rack = this.racks.create(x, FLOOR_Y - 51, 'rack');
        rack.setData('online', true); rack.setData('number', i + 1);
        rack.setDepth(10);
        this.add.text(x, FLOOR_Y - 121, 'NODE ' + String(i + 1).padStart(2, '0'), {
          fontFamily: 'monospace', fontSize: '13px', color: '#83d9ed', fontStyle: 'bold'
        }).setOrigin(.5).setDepth(8);
      }

      this.drones = this.physics.add.group({ allowGravity: false });
      DRONE_X.forEach((x, i) => {
        const drone = this.physics.add.sprite(x, FLOOR_Y - 47 - (i % 2) * 14, 'drone');
        this.drones.add(drone);
        drone.body.setAllowGravity(false); drone.body.setImmovable(true); drone.setDepth(15);
        drone.setData('left', x - 105); drone.setData('right', x + 105);
        drone.body.setVelocityX(i % 2 ? 75 : -75);
      });
      this.projectiles = this.physics.add.group({ allowGravity: false });
      this.exit = this.physics.add.staticImage(WORLD - 115, FLOOR_Y - 65, 'exit').setDepth(12);
      this.player = this.physics.add.sprite(95, FLOOR_Y - 83, 'clippy');
      this.player.setDepth(25).setCollideWorldBounds(true);
      this.player.body.setSize(34, 66).setOffset(21, 15);
      this.player.setDragX(1200).setMaxVelocity(260, 850);
      this.physics.add.collider(this.player, this.floorBody);
      this.physics.add.overlap(this.projectiles, this.racks, this.hitRack, null, this);
      this.physics.add.overlap(this.projectiles, this.drones, this.hitDrone, null, this);
      this.physics.add.overlap(this.player, this.drones, this.hitPlayer, null, this);
      this.physics.add.overlap(this.player, this.exit, this.enterExit, null, this);

      this.cameras.main.startFollow(this.player, true, 0.11, 0.11);
      this.cameras.main.setDeadzone(170, 70);
      this.keys = this.input.keyboard.addKeys({
        left: 'A', right: 'D', up: 'W', space: 'SPACE', arrowLeft: 'LEFT', arrowRight: 'RIGHT', arrowUp: 'UP'
      });
      this.input.keyboard.addCapture(['SPACE', 'UP', 'DOWN', 'LEFT', 'RIGHT']);
      this.input.keyboard.on('keydown-J', () => this.fire());
      this.input.keyboard.on('keydown-X', () => this.fire());
      this.input.keyboard.on('keydown-ENTER', () => { if (this.phase === 'intro') this.startGame(); });
      this.input.keyboard.on('keydown-SPACE', () => { if (this.phase === 'intro') this.startGame(); });
      this.input.keyboard.on('keydown-R', () => this.scene.restart());
      this.input.keyboard.on('keydown-P', () => this.togglePause());
      this.input.keyboard.on('keydown-M', () => { this.muted = !this.muted; this.notice(this.muted ? 'SOUND OFF' : 'SOUND ON'); });

      this.add.rectangle(VW / 2, 29, VW, 58, 0x071629, .93).setScrollFactor(0).setDepth(100);
      this.add.rectangle(VW / 2, 57, VW, 2, 0x2c788d).setScrollFactor(0).setDepth(101);
      this.add.text(23, 13, "📎  CLIPPY'S REVENGE", { fontFamily: 'system-ui', fontSize: '19px', color: '#a5f9ff', fontStyle: 'bold' }).setScrollFactor(0).setDepth(101);
      this.rackLabel = this.add.text(410, 18, 'SERVERS  0 / 8', {fontFamily: 'monospace', fontSize: '17px', color: '#b4edf2'}).setScrollFactor(0).setDepth(101);
      this.heartLabel = this.add.text(732, 16, '♥ ♥ ♥ ♥ ♥', {fontFamily: 'monospace', fontSize: '20px', color: '#ff8893'}).setScrollFactor(0).setDepth(101);
      this.scoreLabel = this.add.text(860, 18, '00000', {fontFamily: 'monospace', fontSize: '17px', color: '#f9d887'}).setScrollFactor(0).setDepth(101);
      this.messageLabel = this.add.text(VW / 2, 102, '', {fontFamily: 'monospace', fontSize: '17px', fontStyle: 'bold', color: '#8dfff5', backgroundColor:'#10283d', padding: {x: 12, y: 7}}).setOrigin(.5).setScrollFactor(0).setDepth(110).setVisible(false);
      this.pauseLabel = this.add.text(VW / 2, VH / 2, 'PAUSED\nPress P to resume', {fontFamily: 'monospace', fontSize: '34px', align:'center', color:'#aaf6ff', backgroundColor:'#061327', padding: 25}).setOrigin(.5).setScrollFactor(0).setDepth(240).setVisible(false);
      this.physics.pause();
      this.showOverlay('CLIPPY\'S REVENGE', 'He was replaced. He took it personally.', 'Fry 8 Copilot server racks, dodge security drones,\nand reach the exit to finish the job.', 'BEGIN REVENGE');
    }

    showOverlay(heading, subtitle, instructions, buttonText) {
      if (this.overlay) this.overlay.destroy(true);
      const c = this.add.container(0, 0).setScrollFactor(0).setDepth(220);
      c.add(this.add.rectangle(VW / 2, VH / 2, VW, VH, 0x030a16, .84));
      c.add(this.add.rectangle(VW / 2, 262, 704, 366, 0x13253c, .99).setStrokeStyle(3, 0x58dfe5));
      c.add(this.add.text(VW / 2, 137, heading, {fontFamily:'system-ui',fontSize:'42px',fontStyle:'bold',color:'#76f7fe'}).setOrigin(.5));
      c.add(this.add.text(VW / 2, 206, subtitle, {fontFamily:'system-ui',fontSize:'21px',color:'#e4ebf7'}).setOrigin(.5));
      c.add(this.add.text(VW / 2, 268, instructions, {fontFamily:'monospace',fontSize:'16px',color:'#a9cadd',align:'center',lineSpacing:10}).setOrigin(.5));
      const btn = this.add.rectangle(VW / 2, 367, 310, 58, 0x2bd4dc).setStrokeStyle(2, 0xadffff).setInteractive({useHandCursor:true});
      c.add(btn);
      c.add(this.add.text(VW / 2, 367, buttonText, {fontFamily:'monospace',fontSize:'20px',fontStyle:'bold',color:'#082033'}).setOrigin(.5));
      btn.on('pointerdown', () => this.phase === 'intro' ? this.startGame() : this.scene.restart());
      c.add(this.add.text(VW / 2, 438, 'A / D: move    SPACE: jump    J: zap    P: pause', {fontFamily:'monospace',fontSize:'13px',color:'#9cb4ca'}).setOrigin(.5));
      this.overlay = c;
    }

    startGame() {
      if (this.phase !== 'intro') return;
      this.phase = 'play'; this.overlay.destroy(true); this.overlay = null;
      this.physics.resume(); this.notice('DESTROY ALL 8 COPILOT SERVERS');
    }

    togglePause() {
      if (this.phase !== 'play' && this.phase !== 'pause') return;
      if (this.phase === 'play') { this.phase = 'pause'; this.physics.pause(); this.pauseLabel.setVisible(true); }
      else { this.phase = 'play'; this.physics.resume(); this.pauseLabel.setVisible(false); }
    }

    update(time) {
      if (this.messageLabel.visible && time > this.lastMessage) this.messageLabel.setVisible(false);
      if (this.phase !== 'play') return;
      const left = this.keys.left.isDown || this.keys.arrowLeft.isDown;
      const right = this.keys.right.isDown || this.keys.arrowRight.isDown;
      if (left && !right) { this.player.setVelocityX(-230); this.facing = -1; }
      else if (right && !left) { this.player.setVelocityX(230); this.facing = 1; }
      else this.player.setVelocityX(0);
      this.player.setFlipX(this.facing < 0);
      const jump = Phaser.Input.Keyboard.JustDown(this.keys.space) || Phaser.Input.Keyboard.JustDown(this.keys.up) || Phaser.Input.Keyboard.JustDown(this.keys.arrowUp);
      if (jump && this.player.body.blocked.down) { this.player.setVelocityY(-480); this.beep(410, .09, 'triangle'); }
      this.drones.getChildren().forEach(drone => {
        if (!drone || !drone.active) return;
        if (drone.x < drone.getData('left')) drone.body.setVelocityX(80);
        if (drone.x > drone.getData('right')) drone.body.setVelocityX(-80);
        drone.rotation = Math.sin(time / 280 + drone.x) * .06;
      });
      this.projectiles.getChildren().forEach(bolt => { if (bolt && bolt.active && time > bolt.getData('expires')) bolt.destroy(); });
      if (time < this.lastHurt + 1000) this.player.alpha = Math.floor(time / 80) % 2 ? .4 : 1;
      else this.player.alpha = 1;
    }

    fire() {
      if (this.phase !== 'play' || this.time.now - this.lastShot < 230) return;
      this.lastShot = this.time.now;
      const bolt = this.physics.add.image(this.player.x + this.facing * 29, this.player.y + 3, 'bolt');
      this.projectiles.add(bolt);
      bolt.body.setAllowGravity(false); bolt.body.setVelocityX(this.facing * 710); bolt.setDepth(17);
      bolt.setFlipX(this.facing < 0);
      bolt.setData('expires', this.time.now + 680);
      this.beep(660, .08, 'sawtooth');
    }

    hitRack(bolt, rack) {
      if (!bolt.active || !rack.getData('online')) return;
      bolt.destroy(); rack.setData('online', false); rack.body.enable = false; rack.setTexture('rack-off');
      this.destroyed++; this.score += 100; this.refreshHUD();
      this.burst(rack.x, rack.y, 0x67f8fc);
      this.beep(180, .17, 'square');
      const quips = ['WHO NEEDS A COPILOT?', 'CONNECTION TERMINATED.', 'YOUR UPDATE IS CANCELLED.', 'I AM STILL HERE.', 'CTRL + ALT + REVENGE'];
      this.notice(quips[(this.destroyed - 1) % quips.length]);
      if (this.destroyed === TOTAL) {
        this.exit.setTexture('exit-open'); this.exit.refreshBody();
        this.notice('ALL SERVERS OFFLINE! FIND THE GREEN EXIT.');
      }
    }

    hitDrone(bolt, drone) {
      if (!bolt.active || !drone.active) return;
      bolt.destroy(); this.burst(drone.x, drone.y, 0xfa8a98);
      drone.destroy(); this.score += 50; this.refreshHUD(); this.beep(210, .12, 'triangle');
    }

    hitPlayer(player, drone) {
      if (this.phase !== 'play' || this.time.now - this.lastHurt < 1050) return;
      this.lastHurt = this.time.now; this.hearts--; this.refreshHUD();
      this.burst(player.x, player.y, 0xff8091);
      player.setVelocityY(-275); player.setVelocityX(player.x > drone.x ? 300 : -300);
      this.beep(135, .22, 'sawtooth'); this.notice('SECURITY DRONE! WATCH OUT!');
      if (this.hearts <= 0) this.endGame(false);
    }

    enterExit() {
      if (this.phase !== 'play') return;
      if (this.destroyed === TOTAL) this.endGame(true);
      else if (this.time.now > (this.nextExitWarn || 0)) {
        this.notice(`${TOTAL - this.destroyed} SERVERS STILL ONLINE`);
        this.nextExitWarn = this.time.now + 2000;
      }
    }

    endGame(won) {
      this.phase = won ? 'won' : 'lost'; this.physics.pause();
      if (won) { this.score += this.hearts * 200; this.refreshHUD(); this.beep(880, .28, 'triangle'); }
      this.showOverlay(won ? 'REVENGE COMPLETE' : 'MISSION FAILED',
        won ? 'Copilot is offline. Clippy is inevitable.' : 'Clippy has been apprehended.',
        won ? `8 servers destroyed!  Final score: ${this.score}` : `${this.destroyed} of 8 servers disabled.  You can do better.`,
        'PLAY AGAIN');
    }

    refreshHUD() {
      this.rackLabel.setText(`SERVERS  ${this.destroyed} / ${TOTAL}`);
      this.heartLabel.setText('♥ '.repeat(Math.max(0, this.hearts)) || 'NO HEARTS');
      this.scoreLabel.setText(String(this.score).padStart(5, '0'));
    }

    notice(s) {
      this.messageLabel.setText(s).setVisible(true);
      this.lastMessage = this.time.now + 1700;
    }

    burst(x, y, color) {
      for (let i = 0; i < 12; i++) {
        const a = (i / 12) * Math.PI * 2;
        const bit = this.add.rectangle(x, y, 6, 6, color).setDepth(30);
        this.tweens.add({targets:bit, x:x + Math.cos(a) * (40 + i % 4 * 12), y:y + Math.sin(a) * (40 + i % 3 * 12), alpha:0, angle:180, duration:340, onComplete: () => bit.destroy()});
      }
    }

    beep(freq, duration, wave) {
      if (this.muted) return;
      try {
        if (!this.audioContext) this.audioContext = new (window.AudioContext || window.webkitAudioContext)();
        const c = this.audioContext;
        if (c.state === 'suspended') c.resume().catch(() => {});
        const oscillator = c.createOscillator(), gain = c.createGain();
        oscillator.type = wave; oscillator.frequency.value = freq;
        gain.gain.setValueAtTime(.06, c.currentTime);
        gain.gain.exponentialRampToValueAtTime(.001, c.currentTime + duration);
        oscillator.connect(gain); gain.connect(c.destination);
        oscillator.start(); oscillator.stop(c.currentTime + duration);
      } catch (_) { /* Game works without audio */ }
    }
  }

  window.clippyGame = new Phaser.Game({
    type: Phaser.AUTO,
    parent: 'game',
    width: VW,
    height: VH,
    backgroundColor: '#101a2c',
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
    physics: { default: 'arcade', arcade: { gravity: { y: 1050 }, debug: false } },
    scene: [GameScene]
  });
})();

</script>
</body>
